[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2a-backend"
version = "0.1.0"
description = "Local MVP backend for A2A Network"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.103.2",
  "uvicorn[standard]>=0.22.0",
  "pydantic[email]>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["a2a_backend"]
